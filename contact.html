<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">

        <title>Contact</title>
    </head>

    <body>
        <header>
            <!-- スマホ用メニューボタン -->
            <button class="menu-toggle"
                    type="button"
                    aria-label="メニューを開く"
                    aria-expanded="false"
                    aria-controls="global-nav">
                ☰
            </button>

            <!-- ナビゲーション -->
            <nav  id="global-nav">
                <a href="index.html">HOME</a>
                <a href="profile.html">プロフィール</a>
                <a href="skills.html">スキル</a>
                <a href="works.html">制作物</a>
                <a href="contact.html" class="active">お問い合わせ</a>
            </nav>
        </header>

        <main class="contact-container">
            <h2 class="contact-title">お問い合わせ</h2>

            <div class="contact-content">
                <form id="contact-form" action="https://formspree.io/f/xjygyeld" method="POST">

                    <label for="name">お名前</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">メールアドレス</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">お問い合わせ内容</label>
                    <textarea id="message" name="message" required></textarea>

                    <button type="submit">送信する</button>

                    <!-- 送信結果を表示 -->
                    <p id="form-status" role="status" aria-live="polite"></p>

                </form>
            </div>

        </main>

        <!-- フッター -->
        <footer>
            <p>&copy; 2026 TA. All Rights Reserved.</p>
        </footer>

        <!-- ページ上部へ戻るボタン -->
        <button id="back-to-top" type="button" aria-label="ページ上部へ戻る">
            ↑
        </button>

        <script src="JS/menu.js"></script>
        <script src="JS/contact.js"></script>
        <script src="JS/back-to-top.js"></script>
    </body>

</html>
